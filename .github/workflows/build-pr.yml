name: Build Page (From PR)

on:
  pull_request:
    branches:
      - master
    paths-ignore:
      - ".*/**"
      - ".*"
      - "!.tool-versions"
      - "LICENSE*"
      - "SUPPORT.md"

jobs:
  build:
    name: Build Page
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6.0.3

      - name: Setup Ruby
        env:
          BUNDLE_SPECIFIC_PLATFORM: 1
        uses: ruby/setup-ruby@v1.310.0
        with:
          bundler-cache: true

      - name: Build with Jekyll
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build
